name: usd-home

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres18_data:/var/lib/postgresql
    shm_size: 128mb
    mem_limit: 640m
    healthcheck:
      # During first init the official image starts a temporary socket-only server.
      # TCP readiness prevents a false healthy state before its final restart.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      options: {max-size: "10m", max-file: "3"}
    networks: [usd-internal]

  api:
    image: ghcr.io/kolyagazha89/usd-2.0-api:${USD_IMAGE_TAG:?set USD_IMAGE_TAG}
    restart: unless-stopped
    # API startup never executes schema or historical data migrations.
    # Apply reviewed schema migrations explicitly after backing up the database.
    command: ["node", "dist/main.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AUTH_COOKIE_SECURE: "true"
      # Release policy: never auto-send stage mail from the personal mailbox.
      # Fail closed if an old .env still contains Gmail/Resend settings.
      MAIL_PROVIDER: smtp
      MAIL_ACCOUNT_ONLY: "true"
      # Manual ADMIN confirmation only: no scheduled stage/promotional mail.
      MAIL_CRITICAL_STAGE_NOTICES_ENABLED: ${USD_CRITICAL_STAGE_MAIL_ENABLED:-false}
      CORS_ORIGINS: ${USD_FRONTEND_ALLOWED_ORIGINS:-https://app.usd-russia.ru}
      CSRF_TRUSTED_ORIGINS: ${USD_FRONTEND_ALLOWED_ORIGINS:-https://app.usd-russia.ru}
      TRUST_PROXY_HOPS: "1"
      FRONTEND_URL: ${USD_PUBLIC_FRONTEND_ORIGIN:-https://app.usd-russia.ru}
      API_PUBLIC_URL: https://${API_DOMAIN:?set API_DOMAIN}
      PUBLIC_API_URL: https://${API_DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    expose: ["3000"]
    mem_limit: 896m
    logging:
      options: {max-size: "10m", max-file: "3"}
    networks: [usd-internal]

  ollama:
    # Explicit opt-in. NEVER start this service from normal USD auto-deploy.
    # With only 8 GiB in Ubuntu, start first with qwen3:1.7b and monitor RAM.
    profiles: [local-ai]
    image: ollama/ollama:0.40.17
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "6144"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_KEEP_ALIVE: "1m"
    volumes:
      - ollama_models:/root/.ollama
    expose: ["11434"]
    mem_limit: 3g
    cpus: "2.0"
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      options: {max-size: "10m", max-file: "3"}
    networks: [usd-internal]

  frontend:
    image: ghcr.io/kolyagazha89/usd-2.0-frontend:${USD_IMAGE_TAG:?set USD_IMAGE_TAG}
    restart: unless-stopped
    expose: ["80"]
    mem_limit: 128m
    logging:
      options: {max-size: "10m", max-file: "3"}
    networks: [usd-internal]

  caddy:
    # Explicit opt-in: a plain `docker compose up -d` must never expose WAN ports
    # until public ingress is approved. Start with `--profile direct-edge` or name
    # the caddy service explicitly after the operator approves public ingress.
    profiles: [direct-edge]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging:
      options: {max-size: "10m", max-file: "3"}
    networks: [usd-internal]

volumes:
  postgres18_data:
  ollama_models:
  caddy_data:
  caddy_config:

networks:
  usd-internal:
    driver: bridge
