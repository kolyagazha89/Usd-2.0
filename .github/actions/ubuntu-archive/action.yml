name: Prepare official Ubuntu package archive
description: Replace the known Azure archive mirror on GitHub-hosted Linux only
runs:
  using: composite
  steps:
    - name: Verify archive rewrite with offline fixtures
      shell: bash
      run: python3 -B "$GITHUB_ACTION_PATH/test-use-ubuntu-archive.py" -v
    - name: Prepare hosted Ubuntu archive mirror
      shell: bash
      run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 -B "$GITHUB_ACTION_PATH/use-ubuntu-archive.py"
