# Temporary branch-only deterministic artifact regeneration; remove before merge.
name: Rebuild venue season Windows kit
on:
  push:
    branches: [feat/venue-season-multi-stage-20261115]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild operator archive and exact manifest
        run: python3 deploy/venue-lan/build-windows-kit.py
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/downloads/USD-Offline-Windows.zip frontend/public/downloads/USD-Offline-Windows.json frontend/public/downloads/USD-Offline-Guide.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(venue): include verified next-stage season support in Windows kit'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
