# Temporary branch-only release asset generator, removed before merge.
name: Build one-PostgreSQL season Windows operator kit
on:
  push:
    branches: [feat/venue-one-db-stage-history-20261115]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Assemble reviewed season Windows ZIP and its SHA256 manifest
        run: python3 deploy/venue-lan/build-windows-kit.py
      - name: Commit reproducible download artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/downloads/USD-Offline-Windows.zip frontend/public/downloads/USD-Offline-Windows.json frontend/public/downloads/USD-Offline-Guide.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(venue): release one-PostgreSQL USD season Windows kit'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
