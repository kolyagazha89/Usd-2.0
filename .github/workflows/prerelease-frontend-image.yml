name: USD Dark Velocity prerelease frontend image

on:
  push:
    branches:
      - design/dark-velocity-sitewide-20261027
    paths:
      - "frontend/**"
      - ".github/workflows/prerelease-frontend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: usd-dark-velocity-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify prerelease frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript and Vite build
        run: npm run build
        env:
          VITE_API_URL: https://api.usd-russia.ru

  publish:
    name: Publish immutable frontend-only image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/kolyagazha89/usd-2.0-frontend:dv-${{ github.sha }}
          build-args: |
            VITE_API_URL=https://api.usd-russia.ru
          cache-from: type=gha,scope=usd-dark-velocity-frontend
          cache-to: type=gha,mode=max,scope=usd-dark-velocity-frontend
