name: Rebuild tested Windows firewall replay kit
on:
  push:
    branches: [fix/venue-firewall-stale-rule-recovery]
    paths:
      - 'deploy/venue-lan/**'
      - '.github/workflows/venue-firewall-replay-kit.yml'
permissions:
  contents: write
jobs:
  pack:
    if: github.repository == 'kolyagazha89/Usd-2.0' && github.ref == 'refs/heads/fix/venue-firewall-stale-rule-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/venue-firewall-stale-rule-recovery
          persist-credentials: true
      - name: Rebuild reproducible Windows ZIP and SHA256 manifest
        run: python3 deploy/venue-lan/build-windows-kit.py
      - name: Commit generated Windows distribution only
        run: |
          set -euo pipefail
          git add frontend/public/downloads/USD-Offline-Windows.zip frontend/public/downloads/USD-Offline-Windows.json frontend/public/downloads/USD-Offline-Guide.html
          if git diff --cached --quiet; then echo 'Already matches tested source'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(venue): regenerate installer with firewall replay recovery'
          git push origin HEAD:refs/heads/fix/venue-firewall-stale-rule-recovery
