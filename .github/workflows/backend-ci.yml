name: Backend CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/qr-checkin-and-platform-foundation

permissions:
  contents: read

jobs:
  build-lint-test:
    name: Build, lint and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/usd
      JWT_ISSUER: usd-2.0-api
      JWT_AUDIENCE: usd-2.0-client
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      AUTH_COOKIE_SECURE: 'false'
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:5173

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d usd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Generate CI JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Check historical XLSX snapshot matches GitHub workbooks
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages openpyxl==3.1.5
          python3 ../scripts/sync_historical_xlsx.py --check

      - name: Reject public historical contact data and raw registration XLSX
        run: python3 ../scripts/test_historical_privacy.py

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      # Keep dependency vulnerabilities as a blocking CI gate, but run the
      # functional suite first so an existing audit failure cannot conceal
      # unrelated TypeScript, unit-test, or E2E regressions.
      - name: Dependency audit
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high

  runtime-image-smoke:
    name: Production image (Prisma CLI, non-root, no dev tools)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build the exact runtime Dockerfile
        run: docker build -f backend/Dockerfile --build-arg USD_RELEASE_SHA=${{ github.sha }} -t usd-api-runtime-audit:pr backend

      - name: Confirm effective UID and migration CLI without dev toolchain
        run: |
          docker run --rm --entrypoint sh usd-api-runtime-audit:pr -ec '
            test "$(id -u)" -ne 0
            test -x node_modules/.bin/prisma
            DATABASE_URL=postgresql://usd:usd@127.0.0.1:5432/usd node_modules/.bin/prisma --version
            node -e "require.resolve(\"@prisma/client\")"
            test ! -x node_modules/.bin/jest
            # Prisma CLI keeps TypeScript transitively; verify explicitly
            # banned runtime tooling rather than every transitive binary.
            test ! -x node_modules/.bin/nest
            test ! -x node_modules/.bin/eslint
          '
