name: Backend CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/qr-checkin-and-platform-foundation

permissions:
  contents: read

jobs:
  build-lint-test:
    name: Build, lint and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/usd
      JWT_ISSUER: usd-2.0-api
      JWT_AUDIENCE: usd-2.0-client
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      AUTH_COOKIE_SECURE: 'false'
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:5173

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d usd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Generate CI JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Check historical XLSX snapshot matches GitHub workbooks
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages openpyxl==3.1.5
          python3 ../scripts/sync_historical_xlsx.py --check

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand
