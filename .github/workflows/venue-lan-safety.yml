name: Venue LAN hub safety
on:
  pull_request:
    paths:
      - 'deploy/venue-lan/**'
      - 'frontend/src/venue-api-config.ts'
      - 'frontend/public/usd-venue-config.js'
      - 'frontend/index.html'
      - 'frontend/nginx.conf'
      - '.github/workflows/venue-lan-safety.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/venue-lan/**'
      - 'frontend/src/venue-api-config.ts'
      - 'frontend/public/usd-venue-config.js'
      - 'frontend/index.html'
      - 'frontend/nginx.conf'
      - '.github/workflows/venue-lan-safety.yml'
permissions:
  contents: read
jobs:
  venue-lan-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate RFC1918-only hub and independent credentials
        run: python3 -m unittest discover -s deploy/venue-lan -p 'test_*.py' -v && python3 -m unittest discover -s deploy/venue-lan -p 'test_*.py' -v
      - name: Rehearse no-secret venue compose preflight
        working-directory: deploy/venue-lan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from importlib.machinery import SourceFileLoader
          from importlib.util import module_from_spec,spec_from_loader
          spec=spec_from_loader('venue_preflight',SourceFileLoader('venue_preflight','preflight.py'))
          module=module_from_spec(spec)
          spec.loader.exec_module(module)
          from urllib.parse import quote
          env={
            'VENUE_BIND_IP':'192.168.50.10',
            'VENUE_IMAGE_TAG':'a'*40,
            'VENUE_STAGE_ID':'c510f672-79f7-44eb-8173-2a8ff94b1c0e',
            'VENUE_SIGNING_KEY_FINGERPRINT':'b'*64,
            'VENUE_DB_NAME':'usd_venue',
            'VENUE_DB_USER':'usd_venue',
            'VENUE_DB_ROOT_USER':'usd_venue_root',
            'VENUE_DB_ROOT_PASSWORD':'a different root password stronger than thirty chars',
            'VENUE_DB_PASSWORD':'test-venue-only-password-12345',
            'VENUE_DATABASE_URL':'postgresql://usd_venue:'+quote('test-venue-only-password-12345')+'@db:5432/usd_venue?schema=public',
            'VENUE_JWT_SECRET':'j'*64,
            'VENUE_S3_ROOT_ACCESS':'venue-root-only',
            'VENUE_S3_ROOT_SECRET':'venue-root-secret-only',
            'VENUE_S3_APP_ACCESS':'venue-bucket-only',
            'VENUE_S3_APP_SECRET':'venue-bucket-secret-only',
          }
          module.validate(env)
          Path('.env').write_text('\n'.join(k+'='+v for k,v in env.items())+'\n')
          PY
          python3 preflight.py
          docker compose config --quiet
          rm -f .env
      - name: Set up Node.js for TypeScript smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate laptop-only migration/import and staff wrappers syntax
        run: bash -n deploy/venue-lan/bootstrap-local-stage.sh deploy/venue-lan/provision-venue-staff.sh deploy/venue-lan/initdb/010-venue-api-role.sh
      - name: Verify staff accounts, fixed judge RBAC, and independent local identities
        run: node --test deploy/venue-lan/test-provision-staff.mjs
      - name: Enforce venue journaling installation before official judging
        run: |
          node --test deploy/venue-lan/test-journal-contract.mjs
      - name: Verify encrypted, signed venue-to-Ubuntu return contract without Internet
        run: node --test deploy/venue-lan/test-venue-return-package.mjs deploy/venue-lan/test-export-venue-return.mjs
      - name: Check encrypted USB return helper syntax
        run: bash -n deploy/venue-lan/export-venue-return.sh
      - name: Verify central sync dry-run reports conflicts without network or database
        run: node --test deploy/venue-lan/test-preview-venue-reconciliation.mjs
      - name: Validate signed import planning, replay rejection and transactional writes without any DB
        run: node --test deploy/venue-lan/test-import-stage.mjs
      - name: Validate signed, scope-limited stage packages without connecting to any DB
        run: node --test deploy/venue-lan/test-verify-stage-package.mjs
      - name: Check frontend runtime API selection stays local in venue mode
        run: |
          cd frontend
          npm ci --ignore-scripts
          node --experimental-strip-types --test test/venue-api-config.test.mjs
