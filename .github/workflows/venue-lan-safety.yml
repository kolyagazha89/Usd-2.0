name: Venue LAN hub safety
on:
  pull_request:
    paths:
      - 'deploy/venue-lan/**'
      - 'frontend/src/venue-api-config.ts'
      - 'frontend/public/usd-venue-config.js'
      - 'frontend/index.html'
      - 'frontend/nginx.conf'
      - 'frontend/public/downloads/**'
      - '.github/workflows/venue-lan-safety.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/venue-lan/**'
      - 'frontend/src/venue-api-config.ts'
      - 'frontend/public/usd-venue-config.js'
      - 'frontend/index.html'
      - 'frontend/nginx.conf'
      - 'frontend/public/downloads/**'
      - '.github/workflows/venue-lan-safety.yml'
permissions:
  contents: read
concurrency:
  group: venue-lan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  venue-lan-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify downloadable Windows kit matches reviewed sources
        run: python3 deploy/venue-lan/build-windows-kit.py --check
      - name: Validate RFC1918-only hub and independent credentials
        run: python3 -m unittest discover -s deploy/venue-lan -p 'test_*.py' -v
      - name: Verify actual Caddy TLS, refresh cookies and HTTP spectator boundary
        run: |
          docker create --name usd-caddy-contract caddy:2-alpine
          docker cp usd-caddy-contract:/usr/bin/caddy /tmp/usd-caddy
          docker rm usd-caddy-contract
          chmod +x /tmp/usd-caddy
          CADDY_BIN=/tmp/usd-caddy python3 -m unittest discover -s deploy/venue-lan -p 'test_gateway_runtime.py' -v
      - name: Confirm PostgreSQL Alpine has required dump, restore and SHA256 utilities
        run: |
          docker run --rm --entrypoint sh postgres:18-alpine -c 'command -v pg_dump && command -v pg_restore && command -v sha256sum'
      - name: Exercise actual Docker Compose create, RustFS volume ownership and idempotent replay
        run: bash deploy/venue-lan/test-compose-media-bootstrap.sh
      - name: Recover removed PostgreSQL Docker container with actual retained rows
        run: bash deploy/venue-lan/test-compose-db-recovery.sh
      - name: Rehearse no-secret venue compose preflight
        working-directory: deploy/venue-lan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from importlib.machinery import SourceFileLoader
          from importlib.util import module_from_spec,spec_from_loader
          spec=spec_from_loader('venue_preflight',SourceFileLoader('venue_preflight','preflight.py'))
          module=module_from_spec(spec)
          spec.loader.exec_module(module)
          from urllib.parse import quote
          env={
            'VENUE_BIND_IP':'192.168.50.10',
            'VENUE_IMAGE_TAG':'a'*40,
            'VENUE_STAGE_ID':'c510f672-79f7-44eb-8173-2a8ff94b1c0e',
            'VENUE_SIGNING_KEY_FINGERPRINT':'b'*64,
            'VENUE_DB_NAME':'usd_venue',
            'VENUE_DB_USER':'usd_venue',
            'VENUE_DB_ROOT_USER':'usd_venue_root',
            'VENUE_DB_ROOT_PASSWORD':'a different root password stronger than thirty chars',
            'VENUE_DB_PASSWORD':'test-venue-only-password-12345',
            'VENUE_DATABASE_URL':'postgresql://usd_venue:'+quote('test-venue-only-password-12345')+'@db:5432/usd_venue?schema=public',
            'VENUE_JWT_SECRET':'j'*64,
            'VENUE_S3_ROOT_ACCESS':'venue-root-only',
            'VENUE_S3_ROOT_SECRET':'venue-root-secret-only',
            'VENUE_S3_APP_ACCESS':'venue-bucket-only',
            'VENUE_S3_APP_SECRET':'venue-bucket-secret-only',
          }
          module.validate(env)
          Path('.env').write_text('\n'.join(k+'='+v for k,v in env.items())+'\n')
          PY
          python3 preflight.py
          docker compose config --quiet
          rm -f .env
      - name: Set up Node.js for TypeScript smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate laptop-only migration/import and staff wrappers syntax
        run: bash -n deploy/venue-lan/bootstrap-local-stage.sh deploy/venue-lan/provision-venue-staff.sh deploy/venue-lan/initdb/010-venue-api-role.sh
      - name: Test one-click Windows switch and restricted RustFS first-boot contracts
        run: |
          node --test deploy/venue-lan/test-ensure-return-keys.mjs
          node --test deploy/venue-lan/test-provision-rustfs.mjs
          python3 -m unittest discover -s deploy/venue-lan -p 'test_oneclick.py' -v
      - name: Verify staff accounts, fixed judge RBAC, and independent local identities
        run: node --test deploy/venue-lan/test-provision-staff.mjs deploy/venue-lan/test-provision-existing-staff.mjs
      - name: Enforce venue journaling installation before official judging
        run: |
          node --test deploy/venue-lan/test-journal-contract.mjs
      - name: Verify encrypted, signed venue-to-Ubuntu return contract without Internet
        run: node --test deploy/venue-lan/test-venue-return-package.mjs deploy/venue-lan/test-export-venue-return.mjs
      - name: Check encrypted USB return helper syntax
        run: bash -n deploy/venue-lan/export-venue-return.sh
      - name: Verify central sync dry-run reports conflicts without network or database
        run: node --test deploy/venue-lan/test-preview-venue-reconciliation.mjs
      - name: Verify central return result apply, replay and pending journal safeguards
        run: node --test deploy/venue-lan/test-central-return-apply.mjs
      - name: Syntax check central operator apply (no database or credentials)
        run: node --check backend/scripts/apply-venue-return.mjs
      - name: Require all-or-nothing offline registration, number, inspection and result return
        run: |
          node --test deploy/venue-lan/test-full-return-apply.mjs
          node --check backend/scripts/venue-full-adapter.mjs
          node --check backend/scripts/apply-complete-venue-return.mjs
      - name: Check one-click stage authorization, offline ACK and matching audited crypto
        run: |
          node --test deploy/venue-lan/test-auto-return-contract.mjs
          node --test backend/scripts/venue-sync/authority.test.mjs backend/scripts/venue-sync/contract.test.mjs
          node --check backend/scripts/venue-sync/venue-full-adapter.mjs
      - name: Validate signed import planning, replay rejection and transactional writes without any DB
        run: node --test deploy/venue-lan/test-import-stage.mjs
      - name: Validate signed, scope-limited stage packages without connecting to any DB
        run: node --test deploy/venue-lan/test-verify-stage-package.mjs
      - name: Check frontend runtime API selection stays local in venue mode
        run: |
          cd frontend
          npm ci --ignore-scripts
          node --experimental-strip-types --test test/venue-api-config.test.mjs


  venue-central-return-postgres:
    name: Central signed return with real PostgreSQL 18 (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: venue-ci-only-password
          POSTGRES_DB: usd_venue_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d usd_venue_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend test database driver
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise actual signed return transaction, audit and idempotency
        working-directory: backend
        env:
          VENUE_CENTRAL_TEST_DATABASE_URL: postgresql://postgres:venue-ci-only-password@127.0.0.1:5432/usd_venue_ci
        run: node --test scripts/test-apply-venue-return.integration.mjs

  venue-full-central-postgres:
    name: Full stage return on real PostgreSQL 18 with migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: venue-ci-only-password
          POSTGRES_DB: usd_venue_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d usd_venue_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned backend tools
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply real release schema to isolated PostgreSQL 18
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:venue-ci-only-password@127.0.0.1:5432/usd_venue_ci
        run: ./node_modules/.bin/prisma migrate deploy --config ./prisma7.config.ts
      - name: Verify whole-stage imported entrant, equipment, numbers, inspection and result
        working-directory: backend
        env:
          VENUE_CENTRAL_TEST_DATABASE_URL: postgresql://postgres:venue-ci-only-password@127.0.0.1:5432/usd_venue_ci
        run: node --test scripts/test-full-venue-return.integration.mjs

  venue-windows-launcher:
    name: Windows PowerShell 5.1 one-click launcher syntax
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse actual Windows PowerShell 5.1 installer and firewall scripts
        shell: powershell
        run: |
          $files = @(
            'deploy/venue-lan/venue-control.ps1',
            'deploy/venue-lan/venue-season.ps1',
            'deploy/venue-lan/venue-coverage.ps1',
            'deploy/venue-lan/venue-directory.ps1',
            'deploy/venue-lan/venue-ca.ps1',
            'deploy/venue-lan/venue-update.ps1',
            'deploy/venue-lan/venue-dialogs.ps1',
            'deploy/venue-lan/venue-firewall.ps1',
            'deploy/venue-lan/test-windows-certificate.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Invalid PowerShell syntax: $file"
            }
          }
      - name: Exercise native PowerShell helpers without Docker or administrator access
        shell: powershell
        run: powershell -NoProfile -File deploy/venue-lan/test-windows-helpers.ps1
      - name: Persist signing key and replay interrupted initial Windows setup
        shell: powershell
        run: powershell -NoProfile -File deploy/venue-lan/test-windows-first-install-trust.ps1
      - name: Recover missing DB container safely on PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -File deploy/venue-lan/test-windows-db-recovery.ps1
      - name: Detect missing/unsafe local database roles before Windows signed import
        shell: powershell
        run: powershell -NoProfile -File deploy/venue-lan/test-windows-db-role.ps1
      - name: Execute Windows installer from CONFIGURED through READY and recover at every boundary
        shell: powershell
        run: powershell -NoProfile -File deploy/venue-lan/test-windows-install-e2e.ps1
      - name: Verify same-laptop season isolation and acknowledged journal
        run: powershell -NoProfile -File deploy/venue-lan/test-windows-season.ps1
      - name: Verify native release quoting, selected environment and non-recreating database reads
        shell: powershell
        run: powershell -NoProfile -File deploy/venue-lan/test-windows-release-regressions.ps1
      - name: Verify LIVE and legacy registration upgrades with rollback
        shell: powershell
        run: powershell -NoProfile -File deploy/venue-lan/test-windows-tv-upgrade.ps1
      - name: Retry Caddy root CA extraction and preserve last valid certificate
        shell: powershell
        run: powershell -NoProfile -File deploy/venue-lan/test-windows-certificate.ps1
      - name: Already-admin Windows installation must avoid redundant UAC timeout
        shell: powershell
        run: powershell -NoProfile -File deploy/venue-lan/test-windows-admin-firewall.ps1
      - name: Native Docker timeout must show exact failed installer step
        shell: powershell
        run: powershell -NoProfile -File deploy/venue-lan/test-windows-timeout.ps1
      - name: Offline installer release resolution survives timed-out production API
        shell: powershell
        run: powershell -NoProfile -File deploy/venue-lan/test-windows-release-resolution.ps1
      - name: Reproduce native Docker label parsing on Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -File deploy/venue-lan/test-windows-native-docker-labels.ps1
      - name: Verify a real Windows firewall rule and filter through native NetSecurity
        shell: powershell
        run: powershell -NoProfile -File deploy/venue-lan/test-windows-firewall-native.ps1
      - name: Check launch shortcuts exist and retain their action mappings
        shell: powershell
        run: |
          foreach ($pair in @(@('USD-Install.cmd','install'),@('USD-Offline.cmd','offline'),@('USD-Online.cmd','online'))) {
            $content = Get-Content "deploy/venue-lan/$($pair[0])" -Raw
            if (-not $content.Contains("venue-control.ps1") -or -not $content.Contains("-Action $($pair[1])")) {
              throw "Missing launcher action: $($pair[0])"
            }
          }
