name: tmp-read-xlsx
on:
  push:
    branches: ["tmp/read-xlsx-20261006"]
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Extract
        run: |
          python - <<'PY'
          import json, openpyxl, pathlib
          out={}
          for fn,key in [("USD _ Регистрация.xlsx","registration"),("USD _ Результаты.xlsx","results")]:
              wb=openpyxl.load_workbook(fn,data_only=True,read_only=True)
              sheets={}
              for ws in wb.worksheets:
                  rows=[]
                  for row in ws.iter_rows(values_only=True):
                      rows.append(list(row))
                  sheets[ws.title]=rows
              out[key]=sheets
          pathlib.Path("xlsx-extracted.json").write_text(json.dumps(out,ensure_ascii=False,default=str),encoding="utf-8")
          print(json.dumps({k:{s:len(r) for s,r in v.items()} for k,v in out.items()},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xlsx-extracted
          path: xlsx-extracted.json
