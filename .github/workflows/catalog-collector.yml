name: USD catalogs collector
on:
  workflow_dispatch:
concurrency:
  group: usd-catalog-manual-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: Offline catalog parser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -m unittest discover -s tools/catalogs -p "test_*.py" -v
  cars:
    name: Drom car makes and models
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python tools/catalogs/scrape.py --cars-only --output catalog-output --delay 0.5
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usd-cars-drom
          path: catalog-output/
          if-no-files-found: warn
          retention-days: 30
  audio:
    name: SPL audio catalog (${{ matrix.group }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: ru-1
            brands: "Deaf Bonce,Pride,Aura"
          - group: ru-2
            brands: "DL Audio,Ural,Kicx"
          - group: ru-3
            brands: "Dynamic State,DD Audio,Ground Zero"
          - group: us-1
            brands: "Sundown Audio,Skar Audio,B2 Audio"
          - group: us-2
            brands: "Rockford Fosgate,Hertz,Fi Car Audio"
          - group: us-3
            brands: "Taramps,Stetsom,Resilient Sounds"
          - group: us-4
            brands: "EDGE,AMP,SP Audio,SounDigital"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Extract brand, model, category only
        env:
          AUDIO_BRANDS: ${{ matrix.brands }}
        run: python tools/catalogs/scrape.py --audio-only --brands "$AUDIO_BRANDS" --output catalog-output --delay 0.5
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usd-audio-${{ matrix.group }}
          path: catalog-output/
          if-no-files-found: warn
          retention-days: 30

  merge:
    name: Merge and audit source catalogs
    needs: [cars, audio]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download car fragment
        uses: actions/download-artifact@v4
        with:
          name: usd-cars-drom
          path: collected/cars/
      - name: Download manufacturer fragments
        uses: actions/download-artifact@v4
        with:
          pattern: usd-audio-*
          path: collected/audio/
          merge-multiple: false
      - name: Merge unique models and audit coverage
        run: python tools/catalogs/merge.py --input collected --output catalog-output
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usd-reference-catalogs
          path: catalog-output/
          if-no-files-found: warn
          retention-days: 30
