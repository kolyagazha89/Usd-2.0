name: USD catalogs collector
on:
  push:
    branches:
      - data/catalog-scrapers-20261102
    paths:
      - 'tools/catalogs/**'
      - '.github/workflows/catalog-collector.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Build two-column catalogs
        run: python tools/catalogs/scrape.py --output catalog-output --delay 0.5
      - name: Upload catalogs and coverage regardless of partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usd-reference-catalogs
          path: catalog-output/
          if-no-files-found: warn
          retention-days: 30
