name: One-time reproducible USD venue ZIP refresh
on:
  push:
    branches: [feat/venue-existing-staff-release]
    paths:
      - 'deploy/venue-lan/**'
      - '.github/workflows/venue-kit-release-pack.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/venue-lan/**'
      - '.github/workflows/venue-kit-release-pack.yml'
permissions:
  contents: write
jobs:
  pack:
    if: github.repository == 'kolyagazha89/Usd-2.0' && (github.ref == 'refs/heads/feat/venue-existing-staff-release' || (github.event_name == 'pull_request' && github.head_ref == 'feat/venue-existing-staff-release' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/venue-existing-staff-release
      - name: Regenerate downloadable Windows kit reproducibly
        run: python3 deploy/venue-lan/build-windows-kit.py
      - name: Commit only the distribution files
        run: |
          set -euo pipefail
          git add -- frontend/public/downloads/USD-Offline-Windows.zip frontend/public/downloads/USD-Offline-Guide.html frontend/public/downloads/USD-Offline-Windows.json
          if git diff --cached --quiet; then
            echo 'Downloads already match reviewed sources'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(venue): regenerate release kit after staff admission fix'
          git push origin HEAD:refs/heads/feat/venue-existing-staff-release
