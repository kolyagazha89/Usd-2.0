# Temporary branch-only artifact regeneration; delete this workflow before merge.
name: Regenerate USD Windows kit on branch
on:
  push:
    branches: [fix/venue-real-stage-only-20261115]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild checked-in Windows download files
        run: python3 deploy/venue-lan/build-windows-kit.py
      - name: Commit exact reproducible assets to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/downloads/USD-Offline-Windows.zip frontend/public/downloads/USD-Offline-Windows.json frontend/public/downloads/USD-Offline-Guide.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(venue): regenerate real-only Windows operator kit'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
