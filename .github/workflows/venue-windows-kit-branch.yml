# Temporary branch-only artifact regeneration; delete before merge.
name: Regenerate USD Windows kit on branch
on:
  push:
    branches: [fix/venue-real-stage-only-20261115]
permissions: {contents: write}
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - run: python3 deploy/venue-lan/build-windows-kit.py
      - name: Commit exact reproducible assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/downloads/USD-Offline-Windows.zip frontend/public/downloads/USD-Offline-Windows.json frontend/public/downloads/USD-Offline-Guide.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(venue): remove trial account helper from Windows kit'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
