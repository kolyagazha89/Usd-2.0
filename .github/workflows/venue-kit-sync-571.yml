name: Rebuild USD Windows kit for PR 571
on:
  push:
    branches:
      - fix/venue-gateway-oneclick-20261116
    paths:
      - '.github/workflows/venue-kit-sync-571.yml'
      - 'deploy/venue-lan/**'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Windows release ZIP and manifest from reviewed code
        run: |
          python3 deploy/venue-lan/build-windows-kit.py
          python3 deploy/venue-lan/build-windows-kit.py --check
      - name: Commit exact kit to PR branch
        run: |
          set -eu
          git add frontend/public/downloads/USD-Offline-Windows.zip frontend/public/downloads/USD-Offline-Windows.json frontend/public/downloads/USD-Offline-Guide.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(venue): regenerate ZIP with no-deps Caddy recovery'
          git push origin HEAD:fix/venue-gateway-oneclick-20261116
