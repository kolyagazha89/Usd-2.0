name: Deployed public browser QA

on:
  workflow_run:
    workflows: [Request USD home-PC deploy after images and main checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployed-public-browser-qa
  cancel-in-progress: true

jobs:
  live-public-layout:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 390]
    # The pinned image bundles Chromium and its OS libraries; apt mirrors are not required.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 15
    env:
      USD_LIVE_QA_WIDTH: ${{ matrix.width }}
      USD_BROWSER_TOOLING: /tmp/usd-browser-tooling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser tooling
        run: npm install --prefix "$USD_BROWSER_TOOLING" --no-save --no-package-lock playwright@1.64.1
      - name: Check deployed anonymous pages at the selected width
        run: node scripts/public-browser-qa.mjs
      - name: Save live screenshots and structured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-qa-${{ matrix.width }}-${{ github.run_attempt }}
          path: public-browser-qa/
          retention-days: 7
