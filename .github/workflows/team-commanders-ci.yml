name: Team commanders on PostgreSQL 18

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-team-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/usd_teams_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: usd_teams_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d usd_teams_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm ci
      - name: Rehearse additive migration against a fresh baseline with historical sentinel
        run: node test/team-migration-rehearsal.mjs
      - run: npm run build
      - name: Verify server RBAC, ownership, privacy, moderation and concurrency
        env:
          USD_TEAMS_INTEGRATION_TEST: '1'
        run: npm run test:e2e -- --runInBand --runTestsByPath test/team-commanders.e2e-spec.ts
