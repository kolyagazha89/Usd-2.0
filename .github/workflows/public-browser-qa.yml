name: Public browser QA

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/*browser-qa*.mjs"
      - ".github/workflows/public-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-ui:
    runs-on: ubuntu-latest
    # The full responsive route matrix and account-security flows can exceed
    # 15 minutes on shared runners. Keep every QA scenario, not a reduced set.
    timeout-minutes: 30
    env:
      USD_BROWSER_TOOLING: /tmp/usd-browser-tooling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser tooling
        run: npm install --prefix "$USD_BROWSER_TOOLING" --no-save --no-package-lock playwright@1.64.1
      - name: Install Chromium
        run: '"$USD_BROWSER_TOOLING/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Build and test candidate frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - name: Test isolated public-read verification without network
        run: node --test scripts/public-browser-read-recheck.test.mjs
      - name: Verify live browser network boundary with local fixtures
        run: node scripts/browser-qa-routing-regression.mjs
      - name: Check candidate public, participant and admin interfaces
        run: node scripts/candidate-browser-qa.mjs
      - name: Verify account-security actions and focused controls
        run: node scripts/account-security-browser-qa.mjs
        env:
          USD_ACCOUNT_QA_OUTPUT: ${{ github.workspace }}/account-security-browser-qa
      - name: Verify logo intro waits for visible home and respects reduced motion
        run: node scripts/home-logo-browser-qa.mjs
      - name: Verify partner image framing save, preview and responsive rendering
        run: node scripts/partner-image-browser-qa.mjs
      - name: Verify regulation contents and full-context reading on mobile and desktop
        run: node scripts/rules-browser-qa.mjs
      - name: Verify team directories, roster filters and explicit application journey
        run: node scripts/team-management-browser-qa.mjs
      - name: Verify signup email recovery and resend cooldown across screen sizes
        run: node scripts/verification-resend-browser-qa.mjs
      - name: Save candidate screenshots and structured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-browser-qa-${{ github.run_attempt }}
          path: |
            candidate-browser-qa/
            account-security-browser-qa/
            home-logo-browser-qa/
            partner-image-browser-qa/
            rules-browser-qa/
            team-management-browser-qa/
            verification-resend-browser-qa/
          retention-days: 7

  # A slow or unavailable prerelease host must leave the independently tested
  # candidate result and artifacts available for review.
  live-public-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USD_BROWSER_TOOLING: /tmp/usd-browser-tooling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser tooling
        run: npm install --prefix "$USD_BROWSER_TOOLING" --no-save --no-package-lock playwright@1.64.1
      - name: Install Chromium
        run: '"$USD_BROWSER_TOOLING/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Check deployed anonymous pages at desktop and mobile widths
        run: node scripts/public-browser-qa.mjs
      - name: Save live screenshots and structured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-qa-${{ github.run_attempt }}
          path: public-browser-qa/
          retention-days: 7

  candidate-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USD_BROWSER_TOOLING: /tmp/usd-browser-tooling
      USD_CANDIDATE_QA_WIDTHS: '768,1920'
      USD_CANDIDATE_QA_AXE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned free browser and accessibility tooling
        run: npm install --prefix "$USD_BROWSER_TOOLING" --no-save --no-package-lock playwright@1.64.1 @axe-core/playwright@4.14.0
      - name: Install Chromium
        run: '"$USD_BROWSER_TOOLING/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Build candidate and verify viewport configuration
        run: |
          npm ci --ignore-scripts --prefix frontend
          npm run build --prefix frontend
          node --test scripts/candidate-browser-qa-config.test.mjs
      - name: Check tablet and wide layouts with WCAG A/AA
        run: node scripts/candidate-browser-qa.mjs
      - name: Save accessibility screenshots and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-browser-a11y-${{ github.run_attempt }}
          path: candidate-browser-a11y/
          retention-days: 7
