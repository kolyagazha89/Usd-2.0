name: Temporary published Windows certificate kit
on:
  push:
    branches: [feat/venue-ca-operator-download-and-retry-20261115]
permissions:
  contents: write
concurrency:
  group: venue-ca-zip
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Regenerate downloadable Windows ZIP, guide and SHA256 from reviewed scripts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard FETCH_HEAD
            python3 deploy/venue-lan/build-windows-kit.py
            git add frontend/public/downloads/USD-Offline-Windows.zip frontend/public/downloads/USD-Offline-Windows.json frontend/public/downloads/USD-Offline-Guide.html
            if git diff --cached --quiet; then
              python3 deploy/venue-lan/build-windows-kit.py --check
              exit 0
            fi
            git commit -m 'build(venue-ca): ship certificate button, retries and mobile instructions'
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              python3 deploy/venue-lan/build-windows-kit.py --check
              exit 0
            fi
          done
          exit 1
