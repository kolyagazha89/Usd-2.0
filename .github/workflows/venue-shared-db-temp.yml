name: Venue shared PostgreSQL unit validation
on:
  push:
    branches: [feat/venue-one-db-stage-history-20261115]
permissions: {contents: read}
jobs:
  stage-import-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Test incremental signed import and per-stage return
        run: node --test deploy/venue-lan/test-import-stage.mjs deploy/venue-lan/test-export-venue-return.mjs deploy/venue-lan/test-provision-existing-staff.mjs
  postgres18-season-journal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: usd_venue_root
          POSTGRES_PASSWORD: ci-root-password
          POSTGRES_DB: usd_venue_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U usd_venue_root -d usd_venue_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install pinned database driver
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test real two-stage journal, root migration and immutable history
        env:
          USD_VENUE_TEST_PG_URL: postgresql://usd_venue_root:ci-root-password@127.0.0.1:5432/usd_venue_ci
        run: node deploy/venue-lan/test-season-journal.pg.mjs
