name: Backend CI

on:
  push:
    branches: [main, 'security/**', 'feature/**']
  pull_request:
    branches: [main]

jobs:
  security-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: usd
          POSTGRES_PASSWORD: usd
          POSTGRES_DB: usd
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U usd -d usd"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://usd:usd@localhost:5432/usd
      JWT_ISSUER: usd-2.0-api
      JWT_AUDIENCE: usd-2.0-client
      NODE_ENV: test
      AUTH_COOKIE_SECURE: 'false'
      CORS_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate CI JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand
