name: One-time rebuild venue firewall hotfix kit
on:
  push:
    branches: [fix/venue-windows-firewall-uac-diagnostics]
    paths:
      - 'deploy/venue-lan/**'
      - '.github/workflows/venue-firewall-kit-build.yml'
permissions:
  contents: write
jobs:
  pack:
    if: github.repository == 'kolyagazha89/Usd-2.0' && github.ref == 'refs/heads/fix/venue-windows-firewall-uac-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/venue-windows-firewall-uac-diagnostics
          persist-credentials: true
      - name: Generate deterministic Windows offline kit and digest
        run: python3 deploy/venue-lan/build-windows-kit.py
      - name: Commit generated distribution assets only
        run: |
          set -euo pipefail
          git add frontend/public/downloads/USD-Offline-Windows.zip frontend/public/downloads/USD-Offline-Windows.json frontend/public/downloads/USD-Offline-Guide.html
          if git diff --cached --quiet; then echo 'Windows ZIP matches reviewed source'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(venue): rebuild Windows ZIP with safe hotspot firewall flow'
          git push origin HEAD:refs/heads/fix/venue-windows-firewall-uac-diagnostics
