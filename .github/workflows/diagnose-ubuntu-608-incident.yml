name: USD read-only Ubuntu PR608 incident evidence

on:
  push:
    branches: [diagnose/ubuntu-608-precheck-20261118]
    paths: [.github/workflows/diagnose-ubuntu-608-incident.yml]

permissions: {}

jobs:
  inspect:
    if: github.repository == 'kolyagazha89/Usd-2.0'
    runs-on: [self-hosted, linux, x64, usd-home-pc]
    timeout-minutes: 3
    steps:
      - name: Read exact deployment status and timer without host mutations
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, subprocess, re
          def execute(argv):
              try:
                  p=subprocess.run(argv, capture_output=True, text=True, timeout=12, check=False)
                  return p.stdout if p.returncode==0 else None
              except (OSError, subprocess.TimeoutExpired): return None
          for unit in ('usd-auto-deploy.timer','usd-auto-deploy.service'):
              response=execute(['systemctl','show',unit,
                  '--property=ActiveState,SubState,Result,LastTriggerUSec,NextElapseUSecRealtime,NextElapseUSecMonotonic,ExecMainStatus',
                  '--no-pager'])
              values={}
              for line in (response or '').splitlines():
                  k,_,v=line.partition('=')
                  if k in ('ActiveState','SubState','Result','LastTriggerUSec','NextElapseUSecRealtime','NextElapseUSecMonotonic','ExecMainStatus'):
                      if re.fullmatch(r'[A-Za-z0-9 :+._-]{0,75}',v):values[k]=v
              print(('TIMER' if unit.endswith('.timer') else 'SERVICE')+'='+json.dumps(values,sort_keys=True))
          response=execute(['/usr/local/libexec/usd-deploy-status','read'])
          try:
              status=json.loads(response) if response else {}
          except (ValueError,TypeError): status={}
          fields=('candidate','completed','phase','reason','updated_at')
          print('DEPLOY_STATUS='+json.dumps({k:status.get(k) for k in fields},sort_keys=True))
          print('READ_ONLY_CHECK_COMPLETE=true')
          PY
