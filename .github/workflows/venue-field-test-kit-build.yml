name: One-time reproducible field-test Windows kit build
on:
  push:
    branches: [release/venue-field-test-hardening]
    paths:
      - 'deploy/venue-lan/**'
      - '.github/workflows/venue-field-test-kit-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/venue-lan/**'
      - '.github/workflows/venue-field-test-kit-build.yml'
permissions:
  contents: write
jobs:
  pack:
    if: github.repository == 'kolyagazha89/Usd-2.0' && (github.ref == 'refs/heads/release/venue-field-test-hardening' || (github.event_name == 'pull_request' && github.head_ref == 'release/venue-field-test-hardening' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: release/venue-field-test-hardening
      - name: Regenerate reviewed downloadable Windows ZIP, guide and manifest
        run: python3 deploy/venue-lan/build-windows-kit.py
      - name: Commit only generated distribution files
        run: |
          set -euo pipefail
          git add -- frontend/public/downloads/USD-Offline-Windows.zip frontend/public/downloads/USD-Offline-Guide.html frontend/public/downloads/USD-Offline-Windows.json
          if git diff --cached --quiet; then echo 'Kit already current'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(venue): reproducible one-click Windows field-test kit'
          git push origin HEAD:refs/heads/release/venue-field-test-hardening
