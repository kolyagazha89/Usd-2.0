name: USD catalog data validation
on:
  pull_request:
    paths:
      - 'tools/catalogs/**'
      - '.github/workflows/catalog-data-validation.yml'
  push:
    branches:
      - data/catalog-scrapers-20261102
    paths:
      - 'tools/catalogs/**'
      - '.github/workflows/catalog-data-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Unit tests and static CSV validation
        run: python -m unittest discover -s tools/catalogs -p 'test_*.py' -v
