name: Component catalog concurrency on PostgreSQL 18
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/usd_components_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: usd_components_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d usd_components_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: Verify catalog writer races and rollback
        env:
          USD_COMPONENTS_INTEGRATION_TEST: '1'
        run: npm run test:e2e -- --runInBand --runTestsByPath test/component-catalog-concurrency.e2e-spec.ts
