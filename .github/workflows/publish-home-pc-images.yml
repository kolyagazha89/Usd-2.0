name: Publish self-hosted USD images

# Build on GitHub-hosted workers. The home VM only pulls immutable SHA tags.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-pc-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/home-pc/.env.example deploy/home-pc/.env
      - run: docker compose --project-directory deploy/home-pc -f deploy/home-pc/compose.yaml config --quiet

  publish:
    permissions:
      contents: read
      packages: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: usd-2.0-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: usd-2.0-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      # An owner-controlled repo variable can select apex canonical URLs only
      # with a second explicit approval; no change to REG.RU/DNS occurs here.
      - name: Validate public canonical origin for immutable frontend image
        id: public_origin
        shell: bash
        env:
          REQUESTED: ${{ vars.USD_PUBLIC_SITE_ORIGIN }}
          APPROVED: ${{ vars.USD_PRIMARY_DOMAIN_CUTOVER_APPROVED }}
        run: |
          origin="${REQUESTED:-https://app.usd-russia.ru}"
          if [[ "$origin" == "https://app.usd-russia.ru" ]]; then
            :
          elif [[ "$origin" == "https://usd-russia.ru" && "$APPROVED" == "true" ]]; then
            :
          else
            echo "Refusing unapproved primary-domain canonical switch" >&2
            exit 1
          fi
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/kolyagazha89/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            VITE_API_URL=https://api.usd-russia.ru
            VITE_PUBLIC_SITE_ORIGIN=${{ steps.public_origin.outputs.origin }}
            USD_RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Install checksum-verified pinned Cosign
        run: bash deploy/home-pc/install-ci-cosign.sh
      - name: Sign immutable image digest using this main workflow identity
        env:
          USD_IMAGE: ghcr.io/kolyagazha89/${{ matrix.image }}
          USD_DIGEST: ${{ steps.build.outputs.digest }}
          USD_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: bash deploy/home-pc/sign-published-image.sh
