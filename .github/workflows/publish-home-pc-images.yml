name: Publish self-hosted USD images

# Build on GitHub-hosted workers. The home VM only pulls immutable SHA tags.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-pc-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/home-pc/.env.example deploy/home-pc/.env
      - run: docker compose --project-directory deploy/home-pc -f deploy/home-pc/compose.yaml config --quiet

  publish:
    permissions:
      contents: read
      packages: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: usd-2.0-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: usd-2.0-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/kolyagazha89/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            VITE_API_URL=https://api.usd-russia.ru
            USD_RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Install checksum-verified pinned Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Sign immutable image digest using this main workflow identity
        env:
          USD_IMAGE: ghcr.io/kolyagazha89/${{ matrix.image }}
          USD_DIGEST: ${{ steps.build.outputs.digest }}
          USD_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$USD_DIGEST" =~ ^sha256:[a-f0-9]{64}$ && "$USD_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          # An exact immutable digest can already be signed by this main workflow.
          # Trust only a registry signature verified against this SHA and OIDC identity.
          verify_signature() {
            cosign verify --certificate-identity 'https://github.com/kolyagazha89/Usd-2.0/.github/workflows/publish-home-pc-images.yml@refs/heads/main' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              -a "git_sha=$USD_SOURCE_SHA" "$USD_IMAGE@$USD_DIGEST" >/dev/null
          }
          if verify_signature 2>/dev/null; then
            echo "Trusted immutable image signature already present"
            exit 0
          fi
          # Rekor may respond 409 to duplicate transparency entries. Never
          # ignore a signing error unless the registry signature verifies.
          if ! cosign sign --yes -a "git_sha=$USD_SOURCE_SHA" "$USD_IMAGE@$USD_DIGEST"; then
            echo "Signer did not finish; checking for an existing trusted signature" >&2
          fi
          for attempt in 1 2 3; do
            if verify_signature; then
              echo "Immutable image signature verified"
              exit 0
            fi
            if [[ "$attempt" != 3 ]]; then sleep 5; fi
          done
          echo "Signing failed and no trusted registry signature is verifiable" >&2
          exit 1
