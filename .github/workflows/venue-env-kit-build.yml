name: Rebuild Windows offline env-parser hotfix ZIP
on:
  push:
    branches: [fix/venue-windows-env-parser-20261114]
    paths:
      - 'deploy/venue-lan/**'
      - '.github/workflows/venue-env-kit-build.yml'
permissions:
  contents: write
jobs:
  pack:
    if: github.repository == 'kolyagazha89/Usd-2.0' && github.ref == 'refs/heads/fix/venue-windows-env-parser-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/venue-windows-env-parser-20261114
          persist-credentials: true
      - name: Rebuild pinned, reproducible Windows ZIP and hash manifest
        run: python3 deploy/venue-lan/build-windows-kit.py
      - name: Commit distribution artifacts only
        run: |
          set -euo pipefail
          git add frontend/public/downloads/USD-Offline-Windows.zip frontend/public/downloads/USD-Offline-Windows.json frontend/public/downloads/USD-Offline-Guide.html
          if git diff --cached --quiet; then echo 'Windows ZIP already matches source'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(venue): regenerate Windows kit after env parsing fix'
          git push origin HEAD:refs/heads/fix/venue-windows-env-parser-20261114
