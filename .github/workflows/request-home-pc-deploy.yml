name: Request USD home-PC deploy after images and main checks

# This workflow is loaded from the default branch, never from an unreviewed PR.
# The explicit repository variable remains unset until a real host audit and
# supervised migration/restore acceptance have been completed.
# The runner has no Docker access, production secrets or broad sudo privileges.
on:
  workflow_run:
    workflows:
      - Publish self-hosted USD images
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  # Image publication is the sole trigger, instead of every successful CI.
  # Keep an active root-owned host release running to completion.
  group: usd-home-pc-deploy-trigger
  cancel-in-progress: false

jobs:
  request-deploy:
    # A successful PR or manual workflow_dispatch run must not start the host.
    if: >-
      ${{ vars.USD_HOME_PC_HOST_APPROVED == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.name == 'Publish self-hosted USD images' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, usd-home-pc]
    timeout-minutes: 150
    steps:
      - name: Request root-owned, CI-gated image deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          # No checkout, GitHub secrets, Docker socket or deployment env access.
          # sudoers permits ONLY this exact systemd start operation.
          diagnose_service() {
            # No more privileges: only public systemd state and known benign
            # messages, not arbitrary journals or deployment credentials.
            echo '::error::USD root-owned deployment service failed. Current release was not accepted.' >&2
            systemctl show usd-auto-deploy.service --property=Result --property=ExecMainStatus --property=ExecMainCode --property=ActiveState --no-pager 2>/dev/null || true
            # Print only fixed, non-sensitive health signals. The runner may
            # not inspect root's production config, container socket or credentials.
            if command -v findmnt >/dev/null; then
              if [[ "$(findmnt -n -o SOURCE --mountpoint /srv/usd-s3 2>/dev/null || true)" == /dev/sdb1 ]]; then
                echo 'Second-disk mount: expected /dev/sdb1'
              else
                echo 'Second-disk mount: missing or unexpected'
              fi
            fi
            if command -v df >/dev/null; then
              available_kb="$(df -Pk /var/lib 2>/dev/null | awk 'NR==2 {print $4}' || true)"
              if [[ "$available_kb" =~ ^[0-9]+$ ]]; then
                echo "Host /var/lib free space (KiB): $available_kb"
              else
                echo 'Host /var/lib free space: unavailable'
              fi
            fi
            if command -v journalctl >/dev/null; then
              journalctl --no-pager --quiet --output=cat -u usd-auto-deploy.service -n 100 2>/dev/null |
                # Exact complete, operator-safe messages ONLY. Never send raw
                # journal entries or environment/path fragments to GitHub.
                grep -Ex '(Schema changed; supervised migration and new schema approval required|Current deployment schema differs from approved policy|Insufficient memory or Docker storage for image preparation and restore rehearsal|Main CI gate refused automatic release|Main CI not verified yet; leaving current deployment untouched|Second-disk risk acceptance missing; build-only mode|Dedicated second disk not mounted; release deferred|Second-disk media snapshot failed; release deferred|Missing or untrusted image signature verifier|Missing deployment environment|This SHA already failed release; inspect logs before explicitly clearing failed-release-sha|Cannot compare frontend trees for CI policy|Cannot recheck main branch after CI; deferring release|USD_DEPLOY_PRE_SWITCH_FAILURE: no application image replaced; safe to recheck on the next timer|USD_DEPLOY_RETRYABLE: protected pre-switch failure; no quarantine, next timer will recheck|Fresh PostgreSQL restore/migration rehearsal failed; refusing release|Second disk PostgreSQL copy failed; refusing release|New API/frontend failed readiness checks|Public prerelease acceptance failed; rolling back application images|Previous API/frontend passed readiness after rollback|Existing API/frontend failed pre-release readiness; refusing automatic replacement|Root-owned release approval for this SHA missing)' |
                tail -n 12 || true
            fi
            echo 'Ubuntu: sudo journalctl -u usd-auto-deploy.service -n 120 --no-pager' >&2
            echo 'Never bypass Prisma schema, backup or rollback approval to clear this error.' >&2
          }
          # Publication can finish before all exact-SHA main CI jobs. In that
          # case the root service safely defers, so re-request it periodically
          # rather than only polling a public revision that cannot change yet.
          # Each invocation enforces the same root-owned CI, signature, schema,
          # backup and rollback gates; the runner gains no additional privilege.
          usd_verify_deadline=$((SECONDS+1200))
          while (( SECONDS < usd_verify_deadline )); do
            if ! sudo -n /usr/bin/systemctl start usd-auto-deploy.service; then
              diagnose_service
              exit 1
            fi
            result="$(systemctl show usd-auto-deploy.service --property=Result --value)"
            if [[ "$result" != success ]]; then
              diagnose_service
              exit 1
            fi
            # A short GitHub outage must not make the self-hosted request fail
            # after the root service safely deferred an otherwise valid release.
            if ! usd_latest_sha="$(timeout 20s git ls-remote --exit-code https://github.com/kolyagazha89/Usd-2.0.git refs/heads/main | awk '$2=="refs/heads/main" {print $1}')"; then
              echo 'GitHub main ref temporarily unreachable; retrying without changing the deployed release' >&2
              sleep 60
              continue
            fi
            if [[ ! "$usd_latest_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'GitHub main ref invalid or missing; retrying without changing the deployed release' >&2
              sleep 60
              continue
            fi
            if /usr/local/libexec/usd-verify-prerelease "$usd_latest_sha"; then
              echo "Public prerelease accepted after CI-gated host release: $usd_latest_sha"
              exit 0
            fi
            # CI may still be pending, or a prior poll may have raced the next
            # timer tick. Wait before another read-only/CI-gated host request.
            sleep 60
          done
          echo 'Host release was requested repeatedly, but public acceptance is still missing' >&2
          exit 1
