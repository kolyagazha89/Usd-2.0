name: Request USD home-PC deploy after main safety CI

# This workflow is loaded from the default branch, never from an unreviewed PR.
# The explicit repository variable remains unset until a real host audit and
# supervised migration/restore acceptance have been completed.
# The runner has no Docker access, production secrets or broad sudo privileges.
on:
  workflow_run:
    workflows:
      - Home PC deployment safety checks
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: usd-home-pc-deploy-trigger
  cancel-in-progress: false

jobs:
  request-deploy:
    # A successful PR or manual workflow_dispatch run must not start the host.
    if: >-
      ${{ vars.USD_HOME_PC_HOST_APPROVED == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, usd-home-pc]
    timeout-minutes: 150
    steps:
      - name: Request root-owned, CI-gated local builder
        shell: bash
        run: |
          set -Eeuo pipefail
          # No checkout, GitHub secrets, Docker socket or deployment env access.
          # sudoers permits ONLY this exact systemd start operation.
          sudo -n /usr/bin/systemctl start usd-auto-deploy.service
          result="$(systemctl show usd-auto-deploy.service --property=Result --value)"
          test "$result" = success
          echo 'Host builder completed; actual release still requires local schema policy and independent CI verification.'
