name: Request USD home-PC deploy after images and main checks

# This workflow is loaded from the default branch, never from an unreviewed PR.
# The explicit repository variable remains unset until a real host audit and
# supervised migration/restore acceptance have been completed.
# The runner has no Docker access, production secrets or broad sudo privileges.
on:
  workflow_run:
    workflows:
      - Publish self-hosted USD images
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  # Image publication is the sole trigger, instead of every successful CI.
  # Keep an active root-owned host release running to completion.
  group: usd-home-pc-deploy-trigger
  cancel-in-progress: false

jobs:
  request-deploy:
    # A successful PR or manual workflow_dispatch run must not start the host.
    if: >-
      ${{ vars.USD_HOME_PC_HOST_APPROVED == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.name == 'Publish self-hosted USD images' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, usd-home-pc]
    timeout-minutes: 150
    steps:
      - name: Request root-owned, CI-gated image deployment
        env:
          USD_TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # No checkout, secrets, Docker socket or new sudo permission.
          # The reviewed installed requester reads the sanitized root attempt
          # protocol; systemd success alone never proves a completed release.
          helper=/usr/local/libexec/usd-request-deploy
          [[ -f "$helper" && -x "$helper" && ! -L "$helper" && "$(stat -c %u "$helper")" == 0 ]] &&
            (( (8#$(stat -c %a "$helper") & 022) == 0 )) || {
              echo '::error::Install the reviewed v1 USD deployment helpers on Ubuntu before requesting releases.' >&2
              exit 1
            }
          "$helper" --trigger "$USD_TRIGGER_SHA"
