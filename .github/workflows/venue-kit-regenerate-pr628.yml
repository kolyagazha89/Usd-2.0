name: Regenerate reviewed USD Offline Windows kit (PR 628)
on:
  push:
    branches:
      - feat/venue-signed-disqualification-gate-20261119
    paths:
      - .github/workflows/venue-kit-regenerate-pr628.yml

permissions:
  contents: write

jobs:
  reproducible-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild exactly the allowlisted Windows distribution
        run: |
          python3 deploy/venue-lan/build-windows-kit.py
          python3 deploy/venue-lan/build-windows-kit.py --check
          python3 -m unittest deploy.venue-lan.test_distribution
      - name: Commit only reproducible generated assets into the PR branch
        run: |
          set -euo pipefail
          git config user.name 'usd-ci-kit-builder'
          git config user.email 'usd-ci-kit-builder@users.noreply.github.com'
          git add frontend/public/downloads/USD-Offline-Windows.zip frontend/public/downloads/USD-Offline-Windows.json
          if ! git diff --cached --quiet; then
            git commit -m "build(venue): refresh byte-for-byte reproducible Windows kit for signed ban import"
            git push origin HEAD:feat/venue-signed-disqualification-gate-20261119
          fi
