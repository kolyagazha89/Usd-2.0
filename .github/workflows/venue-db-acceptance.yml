name: Venue real PostgreSQL 18 + LAN API acceptance
on:
  pull_request:
    paths:
      - 'deploy/venue-lan/**'
      - 'backend/src/results/**'
      - 'backend/src/auth/**'
      - 'backend/src/stages/venue-stage*'
      - 'backend/prisma/**'
      - 'backend/Dockerfile'
      - '.github/workflows/venue-db-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/venue-lan/**'
      - 'backend/src/results/**'
      - 'backend/src/auth/**'
      - 'backend/src/stages/venue-stage*'
      - 'backend/prisma/**'
      - 'backend/Dockerfile'
      - '.github/workflows/venue-db-acceptance.yml'
permissions:
  contents: read
jobs:
  venue-db-live-acceptance:
    name: isolated-db-staff-and-live (${{ matrix.staff-mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        staff-mode: [synthetic, existing]
    env:
      USD_VENUE_CI_STAFF_MODE: ${{ matrix.staff-mode }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable venue-only config (no production secrets)
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,secrets
          from pathlib import Path
          from urllib.parse import quote
          secret=secrets.token_urlsafe(32)
          db_user='usd_venue'
          db_name='usd_venue'
          env={
            'VENUE_BIND_IP':'192.168.50.10',
            'VENUE_IMAGE_TAG':os.environ['IMAGE_SHA'],
            'VENUE_STAGE_ID':'c510f672-79f7-44eb-8173-2a8ff94b1c0e',
            'VENUE_SIGNING_KEY_FINGERPRINT':'b'*64,
            'VENUE_DB_NAME':db_name,
            'VENUE_DB_USER':db_user,
            'VENUE_DB_ROOT_USER':'usd_venue_root',
            'VENUE_DB_ROOT_PASSWORD':secrets.token_urlsafe(40),
            'VENUE_DB_PASSWORD':secret,
            'VENUE_DATABASE_URL':f'postgresql://{db_user}:{quote(secret)}@db:5432/{db_name}?schema=public',
            'VENUE_JWT_SECRET':secrets.token_hex(32),
            'VENUE_S3_ROOT_ACCESS':'venue-root-ci',
            'VENUE_S3_ROOT_SECRET':secrets.token_urlsafe(40),
            'VENUE_S3_APP_ACCESS':'venue-bucket-ci',
            'VENUE_S3_APP_SECRET':secrets.token_urlsafe(40),
          }
          target=Path('deploy/venue-lan/.env')
          target.write_text(''.join(f'{k}={v}\n' for k,v in env.items()))
          target.chmod(0o600)
          PY
          cd deploy/venue-lan
          python3 preflight.py
          docker compose config --quiet
      - name: Build exact candidate API image with runtime Prisma and bcrypt
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker build -f backend/Dockerfile \
            --build-arg "USD_RELEASE_SHA=$IMAGE_SHA" \
            -t "ghcr.io/kolyagazha89/usd-2.0-api:$IMAGE_SHA" backend
      - name: Provision actual RustFS 1.0.4 private bucket and verify IAM isolation
        working-directory: deploy/venue-lan
        run: |
          set -a
          source .env
          set +a
          docker compose -p usd-venue up -d rustfs
          docker compose -p usd-venue run --rm --no-deps \
            -e VENUE_S3_ROOT_ACCESS -e VENUE_S3_ROOT_SECRET \
            -e USD_VENUE_CI_DIAG=true \
            --volume "$PWD/provision-rustfs.mjs:/app/provision-rustfs.mjs:ro" \
            --entrypoint node api /app/provision-rustfs.mjs
      - name: Re-run RustFS 1.0.4 IAM provisioning without recreating or escalating existing resources
        working-directory: deploy/venue-lan
        run: |
          set -a
          source .env
          set +a
          docker compose -p usd-venue run --rm --no-deps \
            -e VENUE_S3_ROOT_ACCESS -e VENUE_S3_ROOT_SECRET \
            -e USD_VENUE_INSTALL_DIAG=true \
            --volume "$PWD/provision-rustfs.mjs:/app/provision-rustfs.mjs:ro" \
            --entrypoint node api /app/provision-rustfs.mjs
      - name: Start disposable isolated PostgreSQL 18 and run real migrations
        working-directory: deploy/venue-lan
        run: |
          docker compose -p usd-venue up -d db
          for i in $(seq 1 50); do
            if docker compose -p usd-venue exec -T db pg_isready -U usd_venue -d usd_venue >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker compose -p usd-venue run --rm --no-deps \
            --entrypoint ./node_modules/.bin/prisma api \
            migrate deploy --config ./prisma7.config.ts
      - name: Verify Ed25519 stage import, replay rejection and offline staff on real database
        working-directory: deploy/venue-lan
        run: |
          docker compose -p usd-venue run --rm --no-deps \
            --volume "$PWD/import-stage.mjs:/app/import-stage.mjs:ro" \
            --volume "$PWD/verify-stage-package.mjs:/app/verify-stage-package.mjs:ro" \
            --volume "$PWD/provision-staff.mjs:/app/provision-staff.mjs:ro" \
             --volume "$PWD/venue-judge-permissions.mjs:/app/venue-judge-permissions.mjs:ro" \
            --volume "$PWD/provision-existing-staff.mjs:/app/provision-existing-staff.mjs:ro" \
            --volume "$PWD/venue-db-acceptance.mjs:/app/venue-db-acceptance.mjs:ro" \
            --volume "$PWD/venue-return-package.mjs:/app/venue-return-package.mjs:ro" \
            --volume "$PWD/export-venue-return.mjs:/app/export-venue-return.mjs:ro" \
            -e USD_VENUE_CI_STAFF_MODE \
            --entrypoint node api /app/venue-db-acceptance.mjs seed
      - name: Install trusted append-only venue write journal as isolated database root
        working-directory: deploy/venue-lan
        run: |
          docker compose -p usd-venue exec -T db \
            psql -v ON_ERROR_STOP=1 -U usd_venue_root -d usd_venue \
            < install-journal.sql
      - name: Regression - repair duplicate coverage and survive repeated next-stage upgrades
        working-directory: deploy/venue-lan
        run: |
          set -euo pipefail
          db() { docker compose -p usd-venue exec -T db psql -X -v ON_ERROR_STOP=1 -U usd_venue_root -d usd_venue "$@"; }
          before=$(db -Atc 'SELECT count(*) FROM venue_private.operation_journal')
          db -c 'DROP INDEX venue_private.usd_venue_journal_coverage_singleton;'
          db -c 'INSERT INTO venue_private.journal_coverage(format_version,from_sequence) VALUES (2,0);'
          test "$(db -Atc 'SELECT count(*) FROM venue_private.journal_coverage')" = 2
          db < repair-journal-coverage.sql
          for attempt in 1 2 3; do db < upgrade-journal-links.sql; done
          test "$(db -Atc 'SELECT count(*) FROM venue_private.journal_coverage')" = 1
          test "$(db -Atc 'SELECT from_sequence FROM venue_private.journal_coverage')" = 0
          test "$(db -Atc 'SELECT count(*) FROM venue_private.operation_journal')" = "$before"
          if db -c 'INSERT INTO venue_private.journal_coverage(format_version,from_sequence) VALUES (2,0);'; then
            echo 'Duplicate coverage was incorrectly accepted' >&2
            exit 1
          fi
          echo 'USD COVERAGE REPAIR AND REPEATED UPGRADE PASS'
      - name: Verify native active-stage SQL for legacy and retained databases
        working-directory: deploy/venue-lan
        run: |
          python3 - <<'PYSQL'
          from pathlib import Path
          source=Path('venue-season.ps1').read_text(encoding='utf-8-sig')
          body=source.split('function Test-IsActiveVenueStage',1)[1].split("$sql=@'",1)[1].split("'@",1)[0]
          Path('/tmp/usd-active-stage.sql').write_text(body)
          PYSQL
          actual=$(docker compose -p usd-venue exec -T db psql -X -A -t -v ON_ERROR_STOP=1 -U usd_venue_root -d usd_venue < /tmp/usd-active-stage.sql)
          test "$actual" = 'c510f672-79f7-44eb-8173-2a8ff94b1c0e'
          docker compose -p usd-venue exec -T db psql -v ON_ERROR_STOP=1 -U usd_venue_root -d usd_venue -c 'ALTER TABLE venue_private.active_stage RENAME TO active_stage_legacy_test;'
          actual=$(docker compose -p usd-venue exec -T db psql -X -A -t -v ON_ERROR_STOP=1 -U usd_venue_root -d usd_venue < /tmp/usd-active-stage.sql)
          test "$actual" = 'c510f672-79f7-44eb-8173-2a8ff94b1c0e'
          docker compose -p usd-venue exec -T db psql -v ON_ERROR_STOP=1 -U usd_venue_root -d usd_venue -c 'ALTER TABLE venue_private.active_stage_legacy_test RENAME TO active_stage;'
      - name: Exercise real LAN API judge/ADMIN permissions and LIVE write/read
        working-directory: deploy/venue-lan
        run: |
          docker compose -p usd-venue up -d api
          docker compose -p usd-venue run --rm --no-deps \
            --volume "$PWD/import-stage.mjs:/app/import-stage.mjs:ro" \
            --volume "$PWD/verify-stage-package.mjs:/app/verify-stage-package.mjs:ro" \
            --volume "$PWD/provision-staff.mjs:/app/provision-staff.mjs:ro" \
             --volume "$PWD/venue-judge-permissions.mjs:/app/venue-judge-permissions.mjs:ro" \
            --volume "$PWD/provision-existing-staff.mjs:/app/provision-existing-staff.mjs:ro" \
            --volume "$PWD/venue-db-acceptance.mjs:/app/venue-db-acceptance.mjs:ro" \
            --volume "$PWD/venue-return-package.mjs:/app/venue-return-package.mjs:ro" \
            --volume "$PWD/export-venue-return.mjs:/app/export-venue-return.mjs:ro" \
            -e USD_VENUE_CI_STAFF_MODE \
            --entrypoint node api /app/venue-db-acceptance.mjs probe
      - name: Provision a second isolated PostgreSQL 18 central database for 100-entrant LAN return
        working-directory: deploy/venue-lan
        run: |
          set -euo pipefail
          docker compose -p usd-venue exec -T db sh -ec 'export PGPASSWORD="$POSTGRES_PASSWORD"; psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE usd_venue_ci"'
          set -a
          source .env
          set +a
          export VENUE_CENTRAL_TEST_DATABASE_URL="postgresql://${VENUE_DB_ROOT_USER}:${VENUE_DB_ROOT_PASSWORD}@db:5432/usd_venue_ci?schema=public"
          docker compose -p usd-venue run --rm --no-deps \
            -e "DATABASE_URL=$VENUE_CENTRAL_TEST_DATABASE_URL" \
            --entrypoint ./node_modules/.bin/prisma api migrate deploy --config ./prisma7.config.ts
      - name: Test 100 real inspections, 1-5 primary classes, BassRace extra numbers and encrypted LAN-to-central replay
        working-directory: deploy/venue-lan
        timeout-minutes: 20
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          export VENUE_CENTRAL_TEST_DATABASE_URL="postgresql://${VENUE_DB_ROOT_USER}:${VENUE_DB_ROOT_PASSWORD}@db:5432/usd_venue_ci?schema=public"
          docker compose -p usd-venue run --rm --no-deps \
            -e VENUE_CENTRAL_TEST_DATABASE_URL \
            -e VENUE_DB_ROOT_PASSWORD \
            -e USD_VENUE_CI_STAFF_MODE \
            --volume "$PWD/venue-100-roundtrip.mjs:/app/deploy/venue-lan/venue-100-roundtrip.mjs:ro" \
            --volume "$PWD/export-venue-return.mjs:/app/deploy/venue-lan/export-venue-return.mjs:ro" \
            --volume "$PWD/import-stage.mjs:/app/deploy/venue-lan/import-stage.mjs:ro" \
            --volume "$PWD/verify-stage-package.mjs:/app/deploy/venue-lan/verify-stage-package.mjs:ro" \
            --volume "$PWD/venue-return-package.mjs:/app/deploy/venue-lan/venue-return-package.mjs:ro" \
            --volume "$PWD/full-return-apply.mjs:/app/deploy/venue-lan/full-return-apply.mjs:ro" \
            --volume "$PWD/venue-return-review.mjs:/app/deploy/venue-lan/venue-return-review.mjs:ro" \
            --volume "$GITHUB_WORKSPACE/backend/scripts/venue-full-adapter.mjs:/app/backend/scripts/venue-full-adapter.mjs:ro" \
            --entrypoint node api /app/deploy/venue-lan/venue-100-roundtrip.mjs
      - name: Retain two stages in one actual PostgreSQL database and export each independently
        working-directory: deploy/venue-lan
        run: |
          docker compose -p usd-venue stop api
          set -a
          source .env
          set +a
          docker compose -p usd-venue run --rm --no-deps \
            -e VENUE_DB_ROOT_PASSWORD \
            --volume "$PWD/import-stage.mjs:/app/import-stage.mjs:ro" \
            --volume "$PWD/verify-stage-package.mjs:/app/verify-stage-package.mjs:ro" \
            --volume "$PWD/provision-staff.mjs:/app/provision-staff.mjs:ro" \
            --volume "$PWD/venue-judge-permissions.mjs:/app/venue-judge-permissions.mjs:ro" \
            --volume "$PWD/provision-existing-staff.mjs:/app/provision-existing-staff.mjs:ro" \
            --volume "$PWD/venue-db-acceptance.mjs:/app/venue-db-acceptance.mjs:ro" \
            --volume "$PWD/venue-return-package.mjs:/app/venue-return-package.mjs:ro" \
            --volume "$PWD/export-venue-return.mjs:/app/export-venue-return.mjs:ro" \
            --entrypoint node api /app/venue-db-acceptance.mjs season
          db_before=$(docker compose -p usd-venue ps -q db)
          api_before=$(docker compose -p usd-venue ps -aq api)
          test -n "$db_before" && test -n "$api_before"
          VENUE_STAGE_ID=c520f672-79f7-44eb-8173-2a8ff94b1c0e docker compose -p usd-venue \
            up -d --no-build --no-deps --pull never --force-recreate api
          test "$(docker compose -p usd-venue ps -q db)" = "$db_before"
          test "$(docker compose -p usd-venue ps -q api)" != "$api_before"
          docker compose -p usd-venue run --rm --no-deps --entrypoint node api -e '
            (async()=>{
              for(let i=0;i<60;i++){
                try{
                  const response=await fetch("http://api:3000/results/venue-live");
                  const body=await response.json();
                  if(response.ok&&body.stage?.id==="c520f672-79f7-44eb-8173-2a8ff94b1c0e"){
                    console.log("USD RETAINED ACTIVE API + LIVE PASS");return;
                  }
                }catch{}
                await new Promise(resolve=>setTimeout(resolve,1000));
              }
              throw new Error("Second retained stage API did not become ready");
            })().catch(error=>{console.error(error.message);process.exit(1)});
          '
      - name: Historical workspace database read must preserve the running container
        working-directory: deploy/venue-lan
        run: |
          before=$(docker compose -p usd-venue ps -q db)
          other=$(mktemp -d)
          cp compose.yaml "$other/compose.yaml"
          mkdir -p "$other/initdb"
          cp initdb/010-venue-api-role.sh "$other/initdb/"
          docker compose --project-directory "$other" --env-file "$PWD/.env" -p usd-venue -f "$other/compose.yaml" start db
          after=$(docker compose -p usd-venue ps -q db)
          test "$before" = "$after"
          echo 'USD HISTORICAL DB CONTAINER RETAINED'
      - name: Destroy disposable venue database and configuration
        if: always()
        working-directory: deploy/venue-lan
        run: |
          docker compose -p usd-venue down -v --remove-orphans || true
          rm -f .env
