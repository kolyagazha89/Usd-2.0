map $uri $usd_cache_control {
    default "no-cache";
    /usd-release.json "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # QR inspection uses the site's own camera after browser consent.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # Keep headers at one level: a location add_header would discard ALL of
    # the server security headers in nginx 1.27.
    add_header Cache-Control $usd_cache_control always;

    location = /index.html {
        try_files $uri =404;
    }

    location = /usd-release.json {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
