map $uri $usd_spa_route {
    default 0;
    ~^/$ 1;
    # Only real public routes may return the SPA document with HTTP 200.
    ~^/(stages|results|records|rules|privacy|terms|consent|participants|teams|cars|news|partners|documents|contacts|about)(/[^/]+)?/?$ 1;
    ~^/(admin|participant|login|verify-email|reset-password|confirm-email-change|usd-id|offline-event)(/.*)?$ 1;
    ~^/venue/live/?$ 1;
}

map $uri $usd_robots_tag {
    default "";
    ~^/(admin|participant|login|verify-email|reset-password|confirm-email-change|usd-id|offline-event)(/.*)?$ "noindex, nofollow";
    ~^/venue/live/?$ "noindex, nofollow";
}

map $uri $usd_cache_control {
    default "no-cache";
    /usd-release.json "no-store";
    /usd-venue-config.js "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag $usd_robots_tag always;
    error_page 404 /404.html;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Roll out CSP observably before enforcing it: production media, PWA,
    # push and permitted API hosts must be reviewed using real browser reports.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'" always;
    # QR inspection uses the site's own camera after browser consent.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # Keep headers at one level: a location add_header would discard ALL of
    # the server security headers in nginx 1.27.
    add_header Cache-Control $usd_cache_control always;

    location = /404.html {
        internal;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    # Dynamic sitemap is generated by the central API from PUBLISHED and COMPLETED
    # stages, never from drafts or private registrations. Resolve at request time
    # so the frontend image can still start if the API temporarily goes away.
    location = /sitemap.xml {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $seo_upstream "api:3000";
        proxy_pass http://$seo_upstream/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
    }

    location = /index.html {
        try_files $uri =404;
    }

    # Installed iOS/Android PWA and push worker are always refreshed from origin.
    # Keep all security headers inherited from the server block.
    location = /usd-push-sw.js {
        try_files $uri =404;
    }

    # Separate limited-scope offline worker; no API or private responses cached.
    location = /usd-offline-sw.js {
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /usd-release.json {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html @spa;
    }

    location @spa {
        if ($usd_spa_route = 0) { return 404; }
        rewrite ^ /index.html last;
    }
}
