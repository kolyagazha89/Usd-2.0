map $uri $usd_cache_control {
    default "no-cache";
    /usd-release.json "no-store";
    /usd-venue-config.js "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Roll out CSP observably before enforcing it: production media, PWA,
    # push and permitted API hosts must be reviewed using real browser reports.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'" always;
    # QR inspection uses the site's own camera after browser consent.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # Keep headers at one level: a location add_header would discard ALL of
    # the server security headers in nginx 1.27.
    add_header Cache-Control $usd_cache_control always;

    location = /index.html {
        try_files $uri =404;
    }

    # Installed iOS/Android PWA and push worker are always refreshed from origin.
    # Keep all security headers inherited from the server block.
    location = /usd-push-sw.js {
        try_files $uri =404;
    }

    # Separate limited-scope offline worker; no API or private responses cached.
    location = /usd-offline-sw.js {
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /usd-release.json {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
